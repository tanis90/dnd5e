system:
  description:
    value: >-
      <h3 data-anchor="infernal">炼狱</h3><h3
      data-anchor="tiefling-traits">提夫林特质</h3><p><strong>生物类型：</strong>类人</p><p><strong>体型：</strong>中型（约4至7尺高）或小型（约3至4尺高），在你选择该物种时决定</p><p><strong>速度：</strong>30尺</p><p>作为提夫林，你拥有以下特殊特质。</p><p><strong>黑暗视觉。</strong>你拥有60尺黑暗视觉。</p><p><strong>邪魔遗赠。</strong>你接受了一份赋予你超自然能力的遗赠。</p><p>当你达到角色等级3级和5级时，你会习得一个更高环阶的法术，如表中所示。你始终准备着该法术。你可以不消耗法术位施展它一次，完成长休后你重获以此方式施展它的能力。你也可以使用任何具有相应环阶的法术位来施展该法术。智力、感知或魅力是你以此特质施展法术的施法属性（选择传承时选择该属性）。</p><p><strong>异界存在。</strong>你知晓@UUID[Compendium.dnd5e.spells24.Item.phbsplThaumaturg]{奇术}戏法。当你以此特质施展它时，该法术使用你用于邪魔遗赠特质的同一施法属性。</p><table><caption>邪魔遗赠</caption><thead><tr><td>1级</td><td>3级</td><td>5级</td></tr></thead><tbody><tr><td>你具有火焰伤害的抗性。你还知晓@UUID[Compendium.dnd5e.spells24.Item.phbsplFireBolt00]{火焰箭}戏法。</td><td>@UUID[Compendium.dnd5e.spells24.Item.phbsplHellishReb]{炼狱叱喝}</td><td>@UUID[Compendium.dnd5e.spells24.Item.phbsplDarkness00]{黑暗术}</td></tr></tbody></table>
