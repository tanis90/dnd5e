  description:
    value: >-
      <h3>侏儒特质 Gnome
      Traits</h3><p><strong>生物类型：</strong>类人</p><p><strong>体型：</strong>小型（约3–4尺高）</p><p><strong>速度：</strong>30尺</p><p>作为侏儒，你具有以下特殊特质。</p><p><strong>黑暗视觉。</strong>你具有60尺黑暗视觉。</p><p><strong>侏儒狡黠。</strong>你进行的智力、感知和魅力豁免检定具有优势。</p><p><strong>侏儒血系。</strong>你属于一支赋予你超自然能力的血系。无论你选择哪支血系，智力、感知或魅力是你以此特质施展法术时的施法属性（选择血系时选择该属性）：</p><p><strong>森林侏儒。</strong>你知晓次级幻象戏法。你也始终准备着动物交谈法术。你可以不消耗法术位地施展该法术，次数等于你的熟练加值，完成一次长休后你重获全部已消耗的使用次数。你也可以用你拥有的任何法术位施展该法术。</p>
