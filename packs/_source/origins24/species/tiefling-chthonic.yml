system:
  description:
    value: >-
      <h3>幽冥 Chthonic</h3><h3>提夫林特质 Tiefling
      Traits</h3><p><strong>生物类型：</strong>类人</p><p><strong>体型：</strong>中型（约4–7尺高）或小型（约3–4尺高），在选择此种族时选择</p><p><strong>速度：</strong>30尺</p><p>作为提夫林，你具有以下特殊特质。</p><p><strong>黑暗视觉。</strong>你具有60尺黑暗视觉。</p><p><strong>邪魔遗赠。</strong>你承载着一份给予你超自然能力的邪魔遗赠。</p><p>当你达到3级和5级时，你学会一道更高环阶的法术，如表中所示。你始终准备着该法术。你可以不消耗法术位地施展它一次，完成一次长休后你重获以此方式施展它的能力。你也可以用你拥有的相应环阶的任何法术位施展该法术。智力、感知或魅力是你以此特质施展法术时的施法属性（选择遗赠时选择该属性）。</p><p><strong>异界存在。</strong>你知晓奇术戏法。当你以此特质施展它时，该法术使用与你邪魔遗赠特质相同的施法属性。</p><table><caption>幽冥遗赠特质</caption><thead><tr><td>1级</td><td>3级</td><td>5级</td></tr></thead><tbody><tr><td>你具有暗蚀伤害抗性。你还知晓颤栗之触戏法。</td><td>虚假生命</td><td>衰弱射线</td></tr></tbody></table>
