  description:
    value: >-
      <p>每当你在自己回合内执行攻击动作时，你可以将其中一次攻击替换为释放魔法能量，覆盖15尺锥状区域或30尺长、5尺宽的线状区域（每次选择其形状）。区域内的每名生物必须进行一次敏捷豁免检定（DC
      8+你的体质调整值+你的熟练加值）。豁免失败时，生物受到1d10点伤害，伤害类型由你的龙族血统特质决定。豁免成功时，伤害减半。当你达到5级（2d10）、11级（3d10）和17级（4d10）时，此伤害增加1d10。</p><p>你可以使用此吐息武器的次数等于你的熟练加值，完成一次长休后你重获全部已消耗的使用次数。</p>
