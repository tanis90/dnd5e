name: Large Form
system:
  description:
    value: >-
      <p>从角色等级5级起，只要身处足够大的空间，你就能以一个附赠动作将体型变为大型。此变形持续10分钟，或直到你将其结束（无需动作）。在此期间，你的力量检定具有优势，且你的速度增加10尺。一旦你使用此特性，你必须完成一次长休才能再次使用。</p><section
      class="secret"
