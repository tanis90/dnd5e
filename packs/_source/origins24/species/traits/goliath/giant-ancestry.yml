  description:
    value: >-
      <p>你是巨人的后裔。选择以下一种增益——来自你先祖的超自然恩惠；你可以使用所选增益的次数等于你的熟练加值，完成一次长休时你恢复所有已消耗的使用次数：</p><p><strong>云之远迹（云巨人）。</strong>以一个附赠动作，你可以用魔法传送至多30尺，前往一个你能看见的未占据空间。</p><p><strong>火之燃烧（火巨人）。</strong>当你以攻击检定命中一个目标并对其造成伤害时，你也可以对该目标造成1d10点火焰伤害。</p><p><strong>霜之刺骨（霜巨人）。</strong>当你以攻击检定命中一个目标并对其造成伤害时，你也可以对该目标造成1d6点寒冷伤害，并将其速度减少10尺，直到你下个回合开始。</p><p><strong>山之翻撞（山丘巨人）。</strong>当你以攻击检定命中一个大型或更小生物并对其造成伤害时，你可以使该目标陷入倒地状态。</p><p><strong>石之坚韧（石巨人）。</strong>当你受到伤害时，你可以采取一个反应，投掷1d12。将你的体质调整值加到掷出的数字上，并以此总值减少伤害。</p><p><strong>岚之暴鸣（风暴巨人）。</strong>当你受到你60尺内一名生物造成的伤害时，你可以采取一个反应，对该生物造成1d8点雷鸣伤害。</p>
