  description:
    value: >-
      <p>你属于一个赋予你超自然能力的血系。</p><p>当你达到角色3级和5级时，你会习得一个更高环阶的法术，如表中所示。你始终准备着该法术。你可以不消耗法术位施展它一次，完成一次长休时你恢复以该方式施展它的能力。你也可以使用你拥有的任何适当环阶的法术位来施展该法术。智力、感知或魅力是你使用此特性施展法术时的施法属性（选择血系时选择该属性）。</p><table><caption>木精灵血系特性</caption><thead><tr><td>1级</td><td>3级</td><td>5级</td></tr></thead><tbody><tr><td>你的速度增加至35尺。你还懂得
      @UUID[Compendium.dnd5e.spells24.Item.phbsplDruidcraft]{德鲁伊伎俩}
      戏法。</td><td>@UUID[Compendium.dnd5e.spells24.Item.phbsplLongstride]{大步奔行}</td><td>@UUID[Compendium.dnd5e.spells24.Item.phbsplPasswithou]{行动无踪}</td></tr></tbody></table><section
