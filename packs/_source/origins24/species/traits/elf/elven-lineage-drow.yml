  description:
    value: >-
      <p>你属于一个赋予你超自然能力的血系。</p><p>当你达到角色3级和5级时，你会习得一个更高环阶的法术，如表中所示。你始终准备着该法术。你可以不消耗法术位施展它一次，完成一次长休时你恢复以该方式施展它的能力。你也可以使用你拥有的任何适当环阶的法术位来施展该法术。智力、感知或魅力是你使用此特性施展法术时的施法属性（选择血系时选择该属性）。</p><h3>卓尔血系特性</h3><table><thead><tr><td><p>1级</p></td><td><p>3级</p></td><td><p>5级</p></td></tr></thead><tbody><tr><td><p>你的黑暗视觉范围增加至120尺。你还懂得
      @UUID[Compendium.dnd5e.spells24.Item.phbsplDancingLig]{舞光术}
      戏法。</p></td><td><p>@UUID[Compendium.dnd5e.spells24.Item.phbsplFaerieFire]{妖火}</p></td><td><p>@UUID[Compendium.dnd5e.spells24.Item.phbsplDarkness00]{黑暗术}</p></td></tr></tbody></table><section
      class="secret" id="secret-9CEnkbCgcLTJ03JL"><p><strong>Foundry
      注记</strong></p><p>当你选择该种族以及提升等级时，系统会自动授予你相关特性和法术。</p></section>
