  description:
    value: >-
      <p>你接受了一份赋予你超自然能力的遗赠。</p><p>当你达到角色3级和5级时，你会习得一个更高环阶的法术，如表中所示。你始终准备着该法术。你可以不消耗法术位施展它一次，完成一次长休时你恢复以该方式施展它的能力。你也可以使用你拥有的任何适当环阶的法术位来施展该法术。智力、感知或魅力是你使用此特性施展法术时的施法属性（选择遗赠时选择该属性）。</p><h3
      data-anchor="infernal">炼狱</h3><p>炼狱遗赠不仅将提夫林与焦炎地狱相连，还将其与九层地狱以及阿刻戎的鏖战战场相连。角、棘刺、尾巴、金色眼睛以及淡淡的硫磺或烟味是此类提夫林的常见生理特征，他们大多将祖先追溯至魔鬼。</p><table><caption>炼狱遗赠特性</caption><thead><tr><td>1级</td><td>3级</td><td>5级</td></tr></thead><tbody><tr><td>你拥有火焰伤害抗性。你还懂得
      @UUID[Compendium.dnd5e.spells24.Item.phbsplFireBolt00]{火焰箭}
      戏法。</td><td>@UUID[Compendium.dnd5e.spells24.Item.phbsplHellishReb]{炼狱叱喝}</td><td>@UUID[Compendium.dnd5e.spells24.Item.phbsplDarkness00]{黑暗术}</td></tr></tbody></table><section
      class="secret" id="secret-UpLnecebx3jeydEG"><p><strong>Foundry
      注记</strong></p><p>抗性和法术会自动授予你，并在进阶时提示你选择施法属性。</p></section>
