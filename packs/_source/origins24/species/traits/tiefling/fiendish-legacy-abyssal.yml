  description:
    value: >-
      <p>你承载着一份给予你超自然能力的邪魔遗赠。</p><p>当你达到3级和5级时，你学会一道更高环阶的法术，如表中所示。你始终准备着该法术。你可以不消耗法术位地施展它一次，完成一次长休后你重获以此方式施展它的能力。你也可以用你拥有的相应环阶的任何法术位施展该法术。智力、感知或魅力是你以此特质施展法术时的施法属性（选择遗赠时选择该属性）。</p><h3>深渊
      Abyssal</h3><p>无底深渊中的熵增、喧癫空隧中的混乱、卡瑟利的绝望，都呼唤着带有深渊遗赠的提夫林。犄角、皮毛、长牙和特殊的气味是这些提夫林共同的身体特征，他们中大多数的血管里奔流着恶魔之血。</p><table><caption>深渊遗赠特质</caption><thead><tr><td>1级</td><td>3级</td><td>5级</td></tr></thead><tbody><tr><td>你具有毒素伤害抗性。你还知晓毒气喷涌戏法。</td><td>致病射线</td><td>定身类人</td></tr></tbody></table>
