  description:
    value: >-
      <p>你承载着一份给予你超自然能力的邪魔遗赠。</p><p>当你达到3级和5级时，你学会一道更高环阶的法术，如表中所示。你始终准备着该法术。你可以不消耗法术位地施展它一次，完成一次长休后你重获以此方式施展它的能力。你也可以用你拥有的相应环阶的任何法术位施展该法术。智力、感知或魅力是你以此特质施展法术时的施法属性（选择遗赠时选择该属性）。</p><h3>幽冥
      Chthonic</h3><p>拥有幽冥邪魔遗赠的提夫林不仅能感受到卡瑟利的泥淖，也能感受到焦炎火狱中的贪婪和哈迪斯中的阴暗。这些提夫林中，有的肤色苍白，彷如死尸。另一些则如同梦魔与魅魔般美丽，还有的则是有着与其那夜鬼婆、尤格罗斯魔或其他中立邪恶的邪魔先祖相似的身体特征。</p><table><caption>幽冥遗赠特质</caption><thead><tr><td>1级</td><td>3级</td><td>5级</td></tr></thead><tbody><tr><td>你具有暗蚀伤害抗性。你还知晓颤栗之触戏法。</td><td>虚假生命</td><td>衰弱射线</td></tr></tbody></table>
