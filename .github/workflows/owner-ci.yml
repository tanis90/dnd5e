# Owner CI：dnd5e fork 自产发布件。
#
# 三条口径，缺一不可：
#   1. 字节唯一事实源 = build/artifact-files.json（payload 清单，1022 文件）。
#      出件工具 tools/owner-ci/build.mjs 按清单逐文件校验 sha256，再按确定性 recipe
#      组装 system.zip（store、路径 code-unit 升序、固定 1980-01-01T00:00:00Z、0644、
#      UTF-8 名），最后从源树重建 zip 做逐字节复核。不按目录猜成员，清单外一律不进包。
#   2. 出件只发生在 tag 上，且 tag 必须落在 main 的血统线上（D8：坐标语义 =
#      主线上的 tag，分支产物没有资格变成坐标）。push 到 main 与 PR 只跑测试
#      出件到 run artifact，不建 Release、不产出可采纳坐标。
#   3. 产物三件：system.zip + system-manifest.json（清单 + 逐文件 sha256/size）+
#      system-receipt.json（runUrl/commit/zip 与 manifest 两个哈希）。本地出证 runUrl 为
#      null；CI 里写真实 run URL，不伪造。
#
# 已退役：上游 .github/workflows/release.yml（用 zip -r 打目录、成员来自 system.json 的
# includes，既非确定性也不等于部署面）。本仓只保留这一条出件路径。
name: owner-ci

on:
  push:
    branches: [main]
    tags: ["release-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  NODE_OPTIONS: "--max-old-space-size=2048"

jobs:
  # 测试线：任何 push / PR 都在干净 clone 上跑完整出件自测（不进 Release）。
  test:
    name: payload + deterministic artifact self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # 上游 devDependencies 只用于 rollup / lessc；postinstall 会跑 build:css+build:db，
      # 出件链不需要（也不该让派生面在 checkout 里凭空出现），故一律 --ignore-scripts。
      - name: install build toolchain
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: focused data regression (feats24 epic boon prerequisites + payload ledger)
        run: node --test tools/owner-ci/feats24-epic-prereq.test.mjs

      - name: assemble + verify (payload sha256 → zip → rebuild from source)
        run: node tools/owner-ci/build.mjs assemble --out-dir "$RUNNER_TEMP/owner-ci"

      - name: determinism (second build must be byte-identical)
        run: |
          node tools/owner-ci/build.mjs assemble --out-dir "$RUNNER_TEMP/owner-ci-2" >/dev/null
          A="$(sha256sum "$RUNNER_TEMP/owner-ci/system.zip" | cut -d' ' -f1)"
          B="$(sha256sum "$RUNNER_TEMP/owner-ci-2/system.zip" | cut -d' ' -f1)"
          if [ "$A" != "$B" ]; then
            echo "::error::两次构建的 system.zip 不一致：$A ≠ $B"
            exit 1
          fi
          echo "zip sha256 $A（两次构建一致）" >> "$GITHUB_STEP_SUMMARY"
          node -e '
            const m = require(process.argv[1]);
            console.log(`system ${m.system.id}@${m.system.version} / ${m.artifact.fileCount} 文件 / ${m.artifact.bytes} B`);
          ' "$RUNNER_TEMP/owner-ci/system-manifest.json" >> "$GITHUB_STEP_SUMMARY"

      - name: upload self-test artifact (not a releasable coordinate)
        uses: actions/upload-artifact@v4
        with:
          name: owner-ci-selftest
          path: |
            ${{ runner.temp }}/owner-ci/system.zip
            ${{ runner.temp }}/owner-ci/system-manifest.json
            ${{ runner.temp }}/owner-ci/system-receipt.json
          if-no-files-found: error
          retention-days: 7

  # 出件线：仅 tag push（release-*），且 tag commit 必须在 main 祖先线上。
  publish:
    name: publish release artifact (tag on main lineage only)
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/release-')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 —— D8 的血统校验要靠完整历史（merge-base --is-ancestor）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: D8 lineage guard (tag commit must be an ancestor of main)
        run: |
          TAG_COMMIT="$(git rev-parse HEAD)"
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$TAG_COMMIT" refs/remotes/origin/main; then
            echo "::error::tag $GITHUB_REF_NAME（$TAG_COMMIT）不在 main 血统线上，拒绝出件（D8）"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME @ $TAG_COMMIT ∈ main 血统 ✔" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: install build toolchain
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: assemble + verify from source tree
        run: |
          node tools/owner-ci/build.mjs assemble \
            --out-dir "$RUNNER_TEMP/dnd5e-artifact" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # 复核的不只是 zip：清单 ↔ zip ↔ 源树三方对齐，并把 zip 落到磁盘再数一次文件集。
      - name: re-verify payload manifest against artifact bytes
        run: |
          OUT="$RUNNER_TEMP/dnd5e-artifact"
          node tools/owner-ci/verify-payload.mjs \
            --artifact "$OUT/system.zip" \
            --manifest "$OUT/system-manifest.json"
          mkdir -p "$OUT/unpacked"
          (cd "$OUT/unpacked" && unzip -q ../system.zip)
          node tools/owner-ci/check-unpacked.mjs "$OUT/unpacked"
          sha256sum "$OUT/system.zip" "$OUT/system-manifest.json" "$OUT/system-receipt.json" >> "$GITHUB_STEP_SUMMARY"

      - name: publish GitHub Release (tag-addressed coordinate)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUT="$RUNNER_TEMP/dnd5e-artifact"
          gh release create "$GITHUB_REF_NAME" \
            "$OUT/system.zip" \
            "$OUT/system-manifest.json" \
            "$OUT/system-receipt.json" \
            --repo "$GITHUB_REPOSITORY" \
            --title "dnd5e $GITHUB_REF_NAME（ArcaneDesk owner CI）" \
            --notes "自产发布件：system.zip 由 build/artifact-files.json（1022 文件）唯一确定，recipe = octopus-system-artifact-zip/1（store / 路径升序 / 固定 1980-01-01 时间戳 / 0644 / UTF-8 名）。runUrl、commit 与两个哈希见 system-receipt.json。"
