       构图：左 2/3 留白给角色名（CSS center/cover 裁掉上下缘，可见带约 y40..130），
       右 1/3 三层 chevron + 六边印 + 顶钻的徽记；细束光斜扫，暗角压顶底托白字。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#14161d"/>
      <stop offset="0.55" stop-color="#1c2030"/>
      <stop offset="1" stop-color="#101219"/>
    </linearGradient>
    <radialGradient id="glow-violet" cx="0.75" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#8b7cff" stop-opacity="0.22"/>
